services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    image: bia-energy-web:latest
    container_name: bia-frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
